    <script>
      /* ── 1. SCROLL PROGRESS ── */
      (function () {
        const bar = document.querySelector('#pa-progress span');
        function tick() {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          const pct = max > 0 ? Math.min(window.scrollY / max * 100, 100) : 0;
          bar.style.width = pct + '%';
        }
        window.addEventListener('scroll', tick, { passive: true });
      })();

      /* ── 2. REVEAL ON SCROLL ── */
      (function () {
        let obs = null;

        function makeObs() {
          if (obs) obs.disconnect();
          obs = new IntersectionObserver(entries => {
            entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              const el = entry.target;
              const siblings = el.parentElement
                ? Array.from(el.parentElement.children).filter(c => c.classList.contains('reveal'))
                : [];
              const idx = Math.max(siblings.indexOf(el), 0);
              el.style.transitionDelay = idx > 0 ? (idx * 0.12) + 's' : '0s';
              el.classList.add('visible');
              obs.unobserve(el);
            });
          }, { threshold: 0.07, rootMargin: '0px 0px -28px 0px' });
        }

        function attach() {
          const els = document.querySelectorAll('.reveal:not(.visible)');
          if (!els.length) return false;
          if (!obs) makeObs();
          els.forEach(el => obs.observe(el));
          return true;
        }

        // Retry until React renders
        const delays = [200, 500, 900, 1500, 2500];
        delays.forEach(d => setTimeout(attach, d));

        // MutationObserver for React updates
        const mo = new MutationObserver(() => attach());
        const root = document.getElementById('root');
        if (root) mo.observe(root, { childList: true, subtree: true });
      })();

      /* ── 3. HERO PARALLAX ── */

        window.addEventListener('scroll', () => {
          if (tick) return;
          tick = true;
          requestAnimationFrame(() => {
            const hero = document.querySelector('section');
            if (hero) hero.style.backgroundPositionY = `calc(center + ${window.scrollY * 0.28}px)`;
            tick = false;
          });
        }, { passive: true });
      })();

      /* ── 4. FIRE SPARKS ── */
      (function () {
        const COLORS = ['#FF8C00','#FFB347','#FF6B00','#FFC857','#FFD580'];

        function spawnSpark(container) {
          const sparks = container.querySelector('.pa-sparks') || (() => {
            const d = document.createElement('div');
            d.className = 'pa-sparks';
            container.style.position = 'relative';
            container.appendChild(d);
            return d;
          })();

          const s = document.createElement('span');
          s.className = 'pa-spark';
          const size = Math.random() * 5 + 2;
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          Object.assign(s.style, {
            width: size + 'px',
            height: size + 'px',
            bottom: (Math.random() * 30 + 5) + '%',
            left: (Math.random() * 88 + 6) + '%',
            background: color,
            boxShadow: `0 0 ${size * 2}px ${color}`,
            '--dx': ((Math.random() - 0.5) * 72) + 'px',
            '--dy': -(Math.random() * 120 + 55) + 'px',
            '--dur': (Math.random() * 1.2 + 0.9).toFixed(2) + 's',
            '--delay': '0s',
          });
          sparks.appendChild(s);
          setTimeout(() => s.remove(), 2400);
        }

        function start() {
          const hero = document.querySelector('section');
          if (!hero) { setTimeout(start, 700); return; }
          for (let i = 0; i < 8; i++) setTimeout(() => spawnSpark(hero), i * 240);
          setInterval(() => spawnSpark(hero), 820);
        }
        window.addEventListener('load', () => setTimeout(start, 900));
      })();

      /* ── 5. TAP RIPPLE ── */

        style.textContent = '@keyframes ripA{to{transform:scale(1);opacity:0;}}';
        document.head.appendChild(style);

        document.addEventListener('pointerdown', e => {
          const btn = e.target.closest('button, a:not(#pa-wa-btn)');
          if (!btn) return;
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height) * 2.2;
          const rip = document.createElement('span');
          Object.assign(rip.style, {
            position: 'absolute',
            left: (e.clientX - rect.left - size / 2) + 'px',
            top:  (e.clientY - rect.top  - size / 2) + 'px',
            width: size + 'px', height: size + 'px',
            borderRadius: '50%',
            background: 'rgba(255,255,255,0.11)',
            transform: 'scale(0)',
            animation: 'ripA 0.55s cubic-bezier(0.22,1,0.36,1) forwards',
            pointerEvents: 'none', zIndex: '10',
          });
          if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
          btn.style.overflow = 'hidden';
          btn.appendChild(rip);
          setTimeout(() => rip.remove(), 600);
        });
      })();

            const href = reactWA.getAttribute('href');
            if (href) document.getElementById('pa-wa-btn').setAttribute('href', href);
            reactWA.style.display = 'none';
          }
        }, 500);
        setTimeout(() => clearInterval(interval), 8000);
      })();

    </script>
  </body>
</html>
