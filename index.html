    <style>
      /* =======================================================
         CORREÇÕES EXCLUSIVAS PARA CELULAR (Telas menores que 768px)
         A versão de PC (Desktop) continuará perfeita e intacta!
         ======================================================= */
      @media (max-width: 768px) {
        /* 1. Remove as bordas pretas (Evita o vazamento horizontal) */
        html, body {
          overflow-x: hidden !important;
          width: 100vw !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        * {
          box-sizing: border-box !important;
          max-width: 100vw !important;
        }

        /* 2. Força a centralização de textos, caixas (badges) e containers flex */
        h1, h2, h3, h4, h5, h6, p {
          text-align: center !important;
          margin-left: auto !important;
          margin-right: auto !important;
          justify-content: center !important;
        }

        /* Puxa caixas (como a do Personal Trainer Online) e outros blocos pro meio */
        .flex {
          justify-content: center !important;
          align-items: center !important;
        }

        /* 3. Arruma a Imagem esticada e evita que corte nas bordas */
        img {
          margin-left: auto !important;
          margin-right: auto !important;
          display: block !important;
          max-width: 90vw !important; /* Limita o tamanho para caber com folga na tela */
          height: auto !important; /* Força a manter a proporção correta */
          object-fit: contain !important; /* Impede a imagem de distorcer ou esticar */
          object-position: center !important; /* Centraliza o desenho da foto */
        }

        /* 4. Centraliza e arruma todos os Botões (Quero começar / Quero acesso) */
        button, a {
          white-space: normal !important;
          height: auto !important;
          min-height: 48px !important;
          line-height: 1.4 !important;
          text-align: center !important;
          max-width: 90% !important;
          margin-left: auto !important;
          margin-right: auto !important;
          /* Transforma o botão num container centralizado para o texto e ícones não fugirem */
          display: flex !important; 
          justify-content: center !important;
          align-items: center !important;
          padding-top: 14px !important;
          padding-bottom: 14px !important;
        }
        
        /* Garantia extra para o elemento pai dos botões e caixas não jogar eles pro lado */
        div:has(> button), div:has(> a) {
           display: flex !important;
           justify-content: center !important;
           width: 100% !important;
        }
      }
    </style>
